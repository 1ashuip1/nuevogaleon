<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Firebase</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-black min-h-screen">

<div class="grid lg:grid-cols-2 min-h-screen">

    <!-- LOGIN -->
    <div class="flex items-center justify-center p-8">

        <div class="w-full max-w-md">

            <div class="text-center mb-8">

                <img
                    src="../assets/logonav2.png"
                    class="h-24 mx-auto mb-4">

                <h1 class="text-4xl font-bold text-white">
                    Administración
                </h1>

                <p class="text-gray-400 mt-2">
                    Gran Galeón
                </p>

            </div>

            <input
                id="email"
                type="email"
                placeholder="Correo"
                class="w-full p-3 rounded-lg mb-4">

            <input
                id="password"
                type="password"
                placeholder="Contraseña"
                class="w-full p-3 rounded-lg mb-4">

            <button
                id="loginBtn"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-lg">

                Ingresar

            </button>

            <p
                id="error"
                class="text-red-500 text-center mt-4">
            </p>

        </div>

    </div>

    <!-- IMAGEN -->
    <div class="hidden lg:block relative">

        <img
            src="../assets/login-bg.jpg"
            class="absolute inset-0 w-full h-full object-cover">

        <div class="absolute inset-0 bg-black/50"></div>

    </div>  

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
