<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Firebase</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-100 hidden" id="bodyAdmin">

<div class="flex min-h-screen">

    <!-- Drawer -->

        <div class="p-6 text-2xl font-bold border-b border-gray-700">
            Gran Galeón
        </div>

        <nav class="mt-6">

            <button
                class="menuBtn w-full text-left px-6 py-4 hover:bg-purple-700"
                data-seccion="eventos">

                Eventos

            </button>

            <button
                class="menuBtn w-full text-left px-6 py-4 hover:bg-purple-700"
                data-seccion="videos">

                Videos

            </button>

            <button
                class="menuBtn w-full text-left px-6 py-4 hover:bg-purple-700"
                data-seccion="galeria">

                Galería

            </button>
            <button
    id="logoutBtn"
    class="w-full text-left px-6 py-4 bg-red-600 hover:bg-red-700">

    Cerrar sesión

</button>

        </nav>

    </aside>

    <!-- Contenido -->
    <main class="ml-64 p-8 w-full">

        <div id="contenidoAdmin">

        </div>

    </main>

</div>

<script type="module" src="panel.js"></script>

</body>
