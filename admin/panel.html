<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Firebase</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-100 hidden" id="bodyAdmin">

<div class="flex min-h-screen">

    <!-- Sidebar -->
<aside class="fixed left-0 top-0 h-screen w-72 bg-gradient-to-b from-slate-950 via-slate-900 to-black border-r border-slate-800 shadow-2xl flex flex-col text-white">

    <!-- Logo -->
    <div class="p-8 border-b border-slate-800">

        <h1 class="text-3xl font-black tracking-wide text-blue-400">
            ⚓ Gran Galeón
        </h1>

        <p class="text-slate-400 mt-2 text-sm">
            Panel Administrativo
        </p>

    </div>

    <!-- Menú -->
    <nav class="flex-1 p-5 space-y-3">

        <button
        data-seccion="eventos"
        class="menuBtn group flex items-center gap-4 w-full rounded-2xl px-5 py-4 bg-blue-700 text-white shadow-lg shadow-blue-900/40 transition-all duration-300">

            <span class="text-2xl">📅</span>

            <span class="font-semibold">
                Eventos
            </span>

        </button>

        <button
        data-seccion="videos"
        class="menuBtn group flex items-center gap-4 w-full rounded-2xl px-5 py-4 hover:bg-slate-800 hover:translate-x-2 transition-all duration-300">

            <span class="text-2xl">🎥</span>

            <span class="font-semibold">
                Videos
            </span>

        </button>

        <button
        data-seccion="galeria"
        class="menuBtn group flex items-center gap-4 w-full rounded-2xl px-5 py-4 hover:bg-slate-800 hover:translate-x-2 transition-all duration-300">

            <span class="text-2xl">👥</span>

            <span class="font-semibold">
                Galería
            </span>

        </button>

    </nav>

    <!-- Footer -->
    <div class="p-5 border-t border-slate-800">

        <button
        id="logoutBtn"
        class="w-full bg-red-700 hover:bg-red-800 transition-all duration-300 rounded-2xl py-4 font-bold shadow-lg">

            🚪 Cerrar sesión

        </button>

    </div>

</aside>

    <!-- Contenido -->
    <main class="ml-64 p-8 bg-black w-full">

        <div id="contenidoAdmin">

        </div>

    </main>

</div>

<script type="module" src="panel.js"></script>

</body>
</html>
